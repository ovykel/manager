name = "person-manager-api-local"
main = "src/index.ts"
compatibility_date = "2026-11-14"
[vars]
FRONT_ORIGIN = "http://localhost:5173"
B2_ENDPOINT = "https://s3.YOUR-REGION.backblazeb2.com"
B2_REGION = "YOUR-REGION"
B2_BUCKET = "YOUR-PRIVATE-BUCKET"
[[d1_databases]]
binding = "DB"
database_name = "person-manager-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[env.production]
name = "person-manager-api"
[env.production.vars]
FRONT_ORIGIN = "https://YOUR-PAGES-PROJECT.pages.dev"
B2_ENDPOINT = "https://s3.YOUR-REGION.backblazeb2.com"
B2_REGION = "YOUR-REGION"
B2_BUCKET = "YOUR-PRIVATE-BUCKET"
[[env.production.d1_databases]]
binding = "DB"
database_name = "person-manager"
database_id = "REPLACE-WITH-REMOTE-D1-ID"
migrations_dir = "migrations"
[env.production.triggers]
crons = ["*/30 * * * *"]
