name = "person-manager-api-local"
main = "src/index.ts"
compatibility_date = "2026-11-14"
[vars]
FRONT_ORIGIN = "http://localhost:5173"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "lesa2002"
[[d1_databases]]
binding = "DB"
database_name = "person-manager-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[env.production]
name = "person-manager-api"
[env.production.vars]
FRONT_ORIGIN = "https://person-manager.pages.dev"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "lesa2002"
[[env.production.d1_databases]]
binding = "DB"
database_name = "person-manager"
database_id = "d69b72b0-05ab-438c-88c5-e497e7975abf"
migrations_dir = "migrations"
[env.production.triggers]
crons = ["*/30 * * * *"]
